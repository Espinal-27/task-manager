<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task Manager CRUD web application built with HTML, CSS and JavaScript.">
    <title>Task Manager | Andrés Espinal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="header">
            <div>
                <p class="eyebrow">ANDRÉS ESPINAL</p>
                <h1>Task Manager</h1>
                <p class="subtitle">
                    A simple and responsive CRUD application for managing daily tasks.
                </p>
            </div>
        </header>

        <section class="task-form-section">

            <form id="taskForm">

                <div class="input-group">
                    <label for="taskInput">Task</label>
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a task..."
                        maxlength="100"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="priorityInput">Priority</label>
                    <select id="priorityInput">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" id="submitButton">
                    Add Task
                </button>

            </form>

        </section>

        <section class="controls">

            <div class="task-counter">
                <strong id="taskCount">0</strong>
                <span>tasks</span>
            </div>

            <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="pending">
                    Pending
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>

            </div>

        </section>

        <section class="tasks-section">

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">✓</div>
                <h2>No tasks yet</h2>
                <p>Add your first task to get started.</p>
            </div>

            <ul id="taskList" class="task-list"></ul>

        </section>

        <footer>
            <p>
                Built with HTML5, CSS3 and JavaScript
            </p>

            <a
                href="https://github.com/Espinal-27"
                target="_blank"
                rel="noopener noreferrer"
            >
                github.com/Espinal-27
            </a>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
